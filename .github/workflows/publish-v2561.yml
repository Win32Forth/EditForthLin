name: Publish EditForthLin 2.5.6.1

on:
  push:
    paths:
      - .github/workflows/publish-v2561.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create v2.5.6.1
    runs-on: ubuntu-latest
    steps:
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: 82076e4c562756634197e13fa8252b728b1e0377
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" << 'EOF'
          # EditForthLin 2.5.6.1

          Source release for Linux x64 and native arm64. There is no installer, no `.deb`, and no AppImage. Clone this tag and build on the machine that will run it.

          This tag is commit `82076e4c562756634197e13fa8252b728b1e0377`.

          ## Build

          ```bash
          git clone https://github.com/Win32Forth/EditForthLin.git
          cd EditForthLin
          git checkout v2.5.6.1
          bash scripts/mint-deps.sh
          ```

          On Linux x86_64:

          ```bash
          bash build-x64.sh
          ./Edit/build/x64/editforthlinx64
          Forth/build/x64/forthx64 --agent -e '2 3 + .'
          ```

          On Linux aarch64:

          ```bash
          bash build-arm64.sh
          ./Edit/build/arm64/editforthlinarm64
          Forth/build/arm64/fortharm64 --agent -e '2 3 + .'
          ```

          Packages and the rest of the steps are in `INSTALLER.md` at this tag. The first run creates `~/Documents/EditForthLin`.

          ## What changed

          Ask Forth help dialogs use the EditForthWin 2.5.6.1 layout. The information icon sits at the top left, and the help text wraps in a block 440 pixels wide. That covers the circled i beside Reference and the circled ? beside Ask Forth and EditForthLin Agent.

          arm64 ANS-VALIDATE: 394 passed, 0 failed. Hayes: all counts zero, including FPERRORS. x64 was not run on the aarch64 build host.

          Kernel banner:

          ```
          === EditForthLin 2.5.6.1 === Oct 26, 2026 4:20 PM ===
          ```

          Still open: the in-process GRAPHICS host, Ask Forth key storage on Linux, Hayes / ANS-VALIDATE on x64, and a `.deb` or AppImage.
          EOF
          sed -i 's/^          //' "$notes"
          gh release create v2.5.6.1 \
            --repo "${{ github.repository }}" \
            --target "$TARGET" \
            --title "EditForthLin 2.5.6.1" \
            --notes-file "$notes"
