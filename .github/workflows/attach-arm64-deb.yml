name: Attach arm64 deb
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    name: Upload the arm64 package
    runs-on: ubuntu-latest
    steps:
      - name: Attach the package to v2.5.6.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          echo "4f22ad0b165b6decb3596a8b3f03fc9f7746cfa0d861738f6ec7220766d7d2cb  Releases/editforthlin_2.5.6.2_arm64.deb" | sha256sum -c -
          gh release upload v2.5.6.2 \
            "Releases/editforthlin_2.5.6.2_arm64.deb#EditForthLin 2.5.6.2 arm64 (Ubuntu 24.04 / Mint 22)" \
            --clobber \
            --repo "${{ github.repository }}"
          python3 -c 'import json,pathlib; pathlib.Path("/tmp/rel.json").write_text(json.dumps({"body": pathlib.Path(".github/release-notes-v2562.md").read_text()}))'
          gh api --method PATCH "repos/${{ github.repository }}/releases/424845267" --input /tmp/rel.json
          git rm -f .github/workflows/attach-arm64-deb.yml .github/release-notes-v2562.md
          git config user.name "Tom Zimmer"
          git config user.email "131190463+Win32Forth@users.noreply.github.com"
          git commit -m "Remove the arm64 package upload workflow."
          git push origin HEAD:main
