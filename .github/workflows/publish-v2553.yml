name: Publish EditForthLin 2.5.5.3

on:
  push:
    paths:
      - .github/workflows/publish-v2553.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create v2.5.5.3
    runs-on: ubuntu-latest
    steps:
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: e31de962be32bfedb3481a7174c4f8cb29c30171
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" << 'EOF'
          # EditForthLin 2.5.5.3

          Source release for Linux x64 and native arm64. There is no installer, no `.deb`, and no AppImage. Clone this tag and build on the machine that will run it.

          This tag is commit `e31de962be32bfedb3481a7174c4f8cb29c30171`.

          ## Build

          ```bash
          git clone https://github.com/Win32Forth/EditForthLin.git
          cd EditForthLin
          git checkout v2.5.5.3
          ./scripts/mint-deps.sh
          ```

          On Linux x86_64:

          ```bash
          bash build-x64.sh
          ./Edit/build/x64/editforthlinx64
          Forth/build/x64/forthx64 --agent -e '2 3 + .'
          ```

          On Linux aarch64:

          ```bash
          bash build-arm64.sh
          ./Edit/build/arm64/editforthlinarm64
          Forth/build/arm64/fortharm64 --agent -e '2 3 + .'
          ```

          Packages and the rest of the steps are in `INSTALLER.md` at this tag. The first run creates `~/Documents/EditForthLin`.

          ## What changed

          Linux x64 `EMIT-APP` was compiling the ARM64 runner and stopping on register names such as `x30`.

          - On x86_64, `app-build.sh` links `emit-lin-run-x64.s`
          - The register file stays in the last 256 bytes of the data segment, immediately after the code
          - Extra host arguments (cblit depth, bigint mul/divmod, mouse buttons) are C parameters
          - The saved GCLOCK image rebuilt on Mint x64 and the program stayed running

          Kernel banner:

          ```
          === EditForthLin 2.5.5.3 === Oct 26, 2026 1:29 PM ===
          ```

          Still open: the in-process GRAPHICS host, Ask Forth key storage on Linux, Hayes / ANS-VALIDATE on x64, and a `.deb` or AppImage.
          EOF
          sed -i 's/^          //' "$notes"
          gh release create v2.5.5.3 \
            --repo "${{ github.repository }}" \
            --target "$TARGET" \
            --title "EditForthLin 2.5.5.3" \
            --notes-file "$notes"
