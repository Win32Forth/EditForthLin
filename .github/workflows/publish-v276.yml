name: Publish EditForthLin 2.7.6

on:
  push:
    paths:
      - .github/workflows/publish-v276.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish the 2.7.6 release
    runs-on: ubuntu-latest
    steps:
      - name: Attach the arm64 package and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch main "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "Tom Zimmer"
          git config user.email "131190463+Win32Forth@users.noreply.github.com"
          if gh release view v2.7.6 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release v2.7.6 already exists"
          else
            echo "cfbf7110c932ef937a54d39c2e51cb1da4181615f45f7c5d213ce6674024350a  Releases/editforthlin_2.7.6_arm64.deb" | sha256sum -c -
            sha=6acfa25423b6c0609d315f32a71ec841d06d0980
            git cat-file -e "$sha^{commit}"
            echo "" | base64 -d > /tmp/rel.md
            gh release create v2.7.6 \
              "Releases/editforthlin_2.7.6_arm64.deb#EditForthLin 2.7.6 arm64 (Ubuntu 24.04.5)" \
              --title "EditForthLin 2.7.6" \
              --notes-file /tmp/rel.md \
              --target "$sha" \
              --repo "${{ github.repository }}"
          fi
          if [ -f .github/workflows/publish-v276.yml ]; then
            git rm -f .github/workflows/publish-v276.yml
            git commit -m "Remove the EditForthLin 2.7.6 publish workflow."
            git push origin HEAD:main
          fi
          git push origin --delete v276-parts v276-p1 v276-p2 v276-p3 v276-p4 v276-p5 v276-p6
