name: Publish EditForthLin 0.1.6

on:
  push:
    paths:
      - .github/workflows/publish-v016.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create v0.1.6
    runs-on: ubuntu-latest
    steps:
      - name: Fetch install notes and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: e5dab0dc55794452137f892bdab795ec3aa39f5a
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/INSTALLER.md" \
            "https://api.github.com/repos/${{ github.repository }}/contents/INSTALLER.md?ref=$TARGET"
          {
            echo "# EditForthLin 0.1.6"
            echo
            echo "Source release for Linux x64 and native arm64. There is no downloaded program. Clone this tag and build on the machine that will run it."
            echo
            echo "This tag is commit \`$TARGET\`."
            echo
            echo "What changed since 0.1.5:"
            echo
            echo "- Native aarch64 kernel. \`GrokTools/arm64_to_gas_linux.py\` translates the ARM64 armasm source to GNU assembler, and \`./build-arm64.sh\` links \`Forth/build/arm64/fortharm64\` plus \`Edit/build/arm64/editforthlinarm64\`."
            echo "- The editor starts \`fortharm64\` on aarch64 and \`forthx64\` on x64."
            echo "- Checked on aarch64: \`fortharm64 --agent -e '2 3 + .'\` prints \`5\`. The editor View command, the debugger, and the Ask Forth window work. Ask Forth still needs a local Ollama server."
            echo
            echo "Kernel banners:"
            echo
            echo '```'
            echo "=== EditForthLin 0.1.6-arm64 === Oct 21, 2026 9:23 PM ==="
            echo "=== EditForthLin 0.1.6-x64 === Oct 21, 2026 9:23 PM ==="
            echo '```'
            echo
            cat "$RUNNER_TEMP/INSTALLER.md"
          } > "$notes"
          gh release create v0.1.6 \
            --repo "${{ github.repository }}" \
            --target "$TARGET" \
            --title "EditForthLin 0.1.6" \
            --notes-file "$notes"
