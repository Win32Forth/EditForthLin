name: Publish EditForthLin 2.6.3

on:
  push:
    paths:
      - .github/workflows/publish-v263.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish the 2.6.3 release
    runs-on: ubuntu-latest
    steps:
      - name: Attach both packages and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          echo "99b8f43f46efe06c9b16041fcebb99ceb6e3899d608f3d7cb2ab1ae92e98c37b  Releases/editforthlin_2.6.3_amd64.deb" | sha256sum -c -
          echo "2dd7bdcb831c89c4eea69927ac1dcad81573b9d0aa4499ed3a043e361862d2bf  Releases/editforthlin_2.6.3_arm64.deb" | sha256sum -c -
          sha=$(git rev-parse HEAD)
          sed "s/@SHA@/${sha}/" .github/release-notes-v263.md > /tmp/rel.md
          gh release create v2.6.3 \
            "Releases/editforthlin_2.6.3_amd64.deb#EditForthLin 2.6.3 amd64 (Linux Mint 22.3)" \
            "Releases/editforthlin_2.6.3_arm64.deb#EditForthLin 2.6.3 arm64 (Ubuntu 24.04.5)" \
            --title "EditForthLin 2.6.3" \
            --notes-file /tmp/rel.md \
            --target "${sha}" \
            --repo "${{ github.repository }}"
          git rm -f .github/workflows/publish-v263.yml .github/release-notes-v263.md
          git config user.name "Tom Zimmer"
          git config user.email "131190463+Win32Forth@users.noreply.github.com"
          git commit -m "Remove the EditForthLin 2.6.3 publish workflow."
          git push origin HEAD:main
